  <script>
  (function(run){ if (document.readyState !== "loading") { run(); }
    else { document.addEventListener("DOMContentLoaded", run); } })(() => {
    const viewport = document.querySelector("#zly-hy-testimonials .zhy-test-viewport");
    const track = document.getElementById("zhy-test-track");
    const prev = document.getElementById("zhy-test-prev");
    const next = document.getElementById("zhy-test-next");
    const dotsWrap = document.getElementById("zhy-test-dots");
    if (!viewport || !track || !prev || !next || !dotsWrap) return;

    const pages = Array.from(track.querySelectorAll(".zhy-test-page"));
    const AUTOPLAY_MS = 6000;
    let index = 0;
    let autoplayTimer = null;

    pages.forEach((_, i) => {
      const dot = document.createElement("button");
      dot.type = "button";
      dot.setAttribute("aria-label", `Go to testimonial page ${i + 1}`);
      dot.addEventListener("click", () => goTo(i, true));
      dotsWrap.appendChild(dot);
    });
    const dots = Array.from(dotsWrap.children);

    function render() {
      track.style.transform = `translateX(-${index * 100}%)`;
      dots.forEach((dot, i) => dot.classList.toggle("is-active", i === index));
    }
    function goTo(i, userInitiated) {
      index = (i + pages.length) % pages.length;
      render();
      if (userInitiated) restartAutoplay();
    }
    function startAutoplay() { if (pages.length < 2) return; autoplayTimer = setInterval(() => goTo(index + 1, false), AUTOPLAY_MS); }
    function stopAutoplay() { clearInterval(autoplayTimer); }
    function restartAutoplay() { stopAutoplay(); startAutoplay(); }

    prev.addEventListener("click", () => goTo(index - 1, true));
    next.addEventListener("click", () => goTo(index + 1, true));
    viewport.addEventListener("mouseenter", stopAutoplay);
    viewport.addEventListener("mouseleave", startAutoplay);
    viewport.addEventListener("focusin", stopAutoplay);
    viewport.addEventListener("focusout", startAutoplay);

    render();
    startAutoplay();
  });
  </script>
