<!--
ZOLEY — CASE STUDIES PAGE — HERO SECTION
-->

<div id="zly-cs-hero">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&family=DM+Sans:wght@400;500;700&family=Caveat:wght@600;700&display=swap');

    #zly-cs-hero {
      --paper: #faf3e7; --ink: #1b2430; --ink-soft: #5c6b76;
      --barn: #b5482d; --violet: #6c5ce7;
      font-family: 'DM Sans', sans-serif; background: var(--paper); color: var(--ink);
    }
    #zly-cs-hero * { box-sizing: border-box; margin: 0; padding: 0; }
    #zly-cs-hero h1 { font-family: 'Newsreader', serif; font-weight: 600; line-height: 1.1; letter-spacing: -0.01em; color: var(--ink); }
    #zly-cs-hero p { color: var(--ink-soft); line-height: 1.65; }
    #zly-cs-hero .tag { font-family: 'Caveat', cursive; font-size: 21px; font-weight: 700; display: inline-block; transform: rotate(-2deg); margin-bottom: 12px; padding: 0 4px; color: var(--barn); }

    #zly-cs-hero .hero { padding: 108px 24px 60px; max-width: 780px; margin: 0 auto; text-align: center; }
    #zly-cs-hero .hero h1 { font-size: clamp(34px, 4.6vw, 54px); }
    #zly-cs-hero .hero p.sub { font-size: 18.5px; max-width: 540px; margin: 20px auto 0; }

    @media (max-width: 900px) {
      #zly-cs-hero .hero { padding: 72px 20px 44px; }
    }
    @media (max-width: 480px) {
      #zly-cs-hero .hero { padding: 56px 18px 36px; }
    }
  </style>

  <section class="hero">
    <span class="tag">real results</span>
    <h1>See what Zoley's built for businesses like yours.</h1>
    <p class="sub">Real businesses, real founders, real numbers. Here's what changed after we got involved.</p>
  </section>
</div>
