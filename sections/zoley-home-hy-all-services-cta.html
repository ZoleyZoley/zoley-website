<!--
ZOLEY — HOMEPAGE — ALL SERVICES BUTTON SECTION
-->

<div id="zly-home-hy-all-services-cta">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&family=DM+Sans:wght@400;500;700&family=Caveat:wght@600;700&display=swap');

    #zly-home-hy-all-services-cta {
      --paper: #faf3e7;
      --paper-2: #f6e4b8;
      --ink: #1b2430;
      --ink-soft: #5c6b76;
      --marigold: #e3a72e;
      --barn: #b5482d;
      --sage: #7a8b69;
      --violet: #6c5ce7;
      --blue: #4ea1ff;
      --border: rgba(27,36,48,0.14);
      font-family: 'DM Sans', -apple-system, sans-serif;
      background: var(--paper);
      color: var(--ink);
    }
    #zly-home-hy-all-services-cta * { box-sizing: border-box; }
    #zly-home-hy-all-services-cta .zhy-section { padding: 90px 24px; max-width: 1160px; margin: 0 auto; }
    #zly-home-hy-all-services-cta h1, #zly-home-hy-all-services-cta h2, #zly-home-hy-all-services-cta h3 { font-family: 'Newsreader', serif; font-weight: 600; line-height: 1.1; letter-spacing: -0.01em; color: var(--ink); }
    #zly-home-hy-all-services-cta p { color: var(--ink-soft); line-height: 1.65; }
    #zly-home-hy-all-services-cta .zhy-tag {
      font-family: 'Caveat', cursive; font-size: 22px; font-weight: 700;
      color: var(--barn);
      display: inline-block; transform: rotate(-2deg); margin-bottom: 10px; padding: 0 4px;
    }

    /* ---------- HERO ---------- */
    #zly-home-hy-all-services-cta .zhy-hero { padding: 112px 24px 60px; max-width: 1160px; margin: 0 auto; display: grid; grid-template-columns: 1.05fr 0.95fr; gap: 50px; align-items: center; }
    #zly-home-hy-all-services-cta .zhy-hero h1 { font-size: clamp(36px, 4.6vw, 58px); }
    #zly-home-hy-all-services-cta .zhy-hero p.zhy-sub { font-size: 18.5px; margin: 22px 0 30px; max-width: 470px; }
    #zly-home-hy-all-services-cta .zhy-cta-row { display: flex; gap: 14px; flex-wrap: wrap; }
    #zly-home-hy-all-services-cta .zhy-btn {
      display: inline-flex; align-items: center; gap: 8px; padding: 15px 28px;
      border-radius: 8px; font-weight: 700; font-size: 15.5px; text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease; cursor: pointer; font-family: 'DM Sans', sans-serif;
    }
    #zly-home-hy-all-services-cta .zhy-btn-primary { background: var(--barn); color: #fff9ef; box-shadow: 0 4px 0 #7c2f19; }
    #zly-home-hy-all-services-cta .zhy-btn-primary:hover { transform: translateY(2px); box-shadow: 0 2px 0 #7c2f19; }
    #zly-home-hy-all-services-cta .zhy-btn-ghost { background: transparent; color: var(--ink); border: 2px solid var(--ink); }
    #zly-home-hy-all-services-cta .zhy-btn-ghost:hover { background: var(--ink); color: var(--paper); }

    /* Signature: corkboard with pinned icons + network threads connecting them */
    #zly-home-hy-all-services-cta .zhy-board {
      background: var(--paper-2); border: 1px solid var(--border); border-radius: 14px;
      padding: 20px; position: relative;
    }
    #zly-home-hy-all-services-cta .zhy-board svg { width: 100%; height: auto; display: block; }
    #zly-home-hy-all-services-cta .zhy-thread { stroke: url(#zhy-thread-grad); stroke-width: 2; stroke-dasharray: 5 5; fill: none; opacity: 0.75; }
    #zly-home-hy-all-services-cta .zhy-pulse { animation: zhy-pulse 3s ease-in-out infinite; transform-origin: center; }
    #zly-home-hy-all-services-cta .zhy-pulse:nth-child(2) { animation-delay: 0.5s; }
    #zly-home-hy-all-services-cta .zhy-pulse:nth-child(3) { animation-delay: 1s; }
    @keyframes zhy-pulse { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { #zly-home-hy-all-services-cta .zhy-pulse { animation: none; } }

    /* ---------- SERVICES ---------- */
    #zly-home-hy-all-services-cta .zhy-services-head { text-align: center; max-width: 640px; margin: 0 auto 40px; }
    #zly-home-hy-all-services-cta .zhy-services-cards { display: flex; flex-wrap: wrap; justify-content: center; gap: 24px; }
    #zly-home-hy-all-services-cta .zhy-card {
      background: #fff9ef; border: 1px solid var(--border); border-radius: 10px;
      padding: 30px; text-align: left; position: relative; overflow: hidden;
      flex: 1 1 280px; max-width: 320px; text-decoration: none; display: block; color: inherit;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }
    #zly-home-hy-all-services-cta .zhy-card::after {
      content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px;
      background: var(--zhy-card-accent, var(--barn));
    }
    #zly-home-hy-all-services-cta .zhy-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 18px 32px -16px rgba(27,36,48,0.28);
      border-color: rgba(27,36,48,0.28);
    }
    #zly-home-hy-all-services-cta .zhy-card svg { width: 44px; height: 44px; margin-bottom: 16px; }
    #zly-home-hy-all-services-cta .zhy-card h3 { font-size: 20px; margin-bottom: 8px; }
    #zly-home-hy-all-services-cta .zhy-card p { font-size: 14.5px; margin: 0; }

    /* ---------- ROTATING TEXT (plain, sits right under Services) ---------- */
    #zly-home-hy-all-services-cta .zhy-rotate-band { padding: 50px 24px 80px; }
    #zly-home-hy-all-services-cta .zhy-rotate-wrapper { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; max-width: 900px; margin: 0 auto; }
    #zly-home-hy-all-services-cta .zhy-static-text { font-family: 'Newsreader', serif; font-weight: 600; font-size: clamp(30px, 5vw, 52px); margin-bottom: 16px; color: var(--barn); line-height: 1.1; }
    #zly-home-hy-all-services-cta .zhy-changing-word { font-family: 'Newsreader', serif; font-weight: 600; font-size: clamp(30px, 5vw, 52px); line-height: 1.2; color: var(--ink); }
    #zly-home-hy-all-services-cta .zhy-cursor { font-family: 'Newsreader', serif; font-size: clamp(30px, 5vw, 52px); color: var(--ink-soft); animation: zhy-blink 1s step-start infinite; }
    @keyframes zhy-blink { 50% { opacity: 0; } }
    @media (max-width: 480px) { #zly-home-hy-all-services-cta .zhy-static-text { margin-bottom: 22px; } }
    @media (prefers-reduced-motion: reduce) { #zly-home-hy-all-services-cta .zhy-cursor { animation: none; } }

    #zly-home-hy-all-services-cta .zhy-all-services { text-align: center; padding: 44px 24px; }

    /* ---------- WHO WE ARE ---------- */
    #zly-home-hy-all-services-cta .zhy-who { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center; }
    #zly-home-hy-all-services-cta .zhy-who h2 { font-size: clamp(30px, 3.6vw, 42px); margin-bottom: 20px; }
    #zly-home-hy-all-services-cta .zhy-who p { font-size: 17.5px; }
    #zly-home-hy-all-services-cta .zhy-who-media {
      aspect-ratio: 4 / 3; border-radius: 16px; overflow: hidden;
      background: linear-gradient(135deg, rgba(122,139,105,0.18), rgba(78,161,255,0.18));
      display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px;
    }
    #zly-home-hy-all-services-cta .zhy-who-media span { font-size: 13.5px; color: var(--ink-soft); font-style: italic; }
    #zly-home-hy-all-services-cta .zhy-who-media img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* ---------- RESOURCES (color break) ---------- */
    #zly-home-hy-all-services-cta .zhy-resources { background: var(--ink); padding: 90px 24px; position: relative; overflow: hidden; }
    #zly-home-hy-all-services-cta .zhy-resources::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 15% 15%, rgba(181,72,45,0.2), transparent 55%), radial-gradient(circle at 90% 85%, rgba(78,161,255,0.18), transparent 55%); }
    #zly-home-hy-all-services-cta .zhy-resources-inner { position: relative; max-width: 1160px; margin: 0 auto; }
    #zly-home-hy-all-services-cta .zhy-resources-head { max-width: 620px; margin: 0 auto 48px; text-align: center; }
    #zly-home-hy-all-services-cta .zhy-resources-head .zhy-tag { color: var(--marigold); }
    #zly-home-hy-all-services-cta .zhy-resources-head h2 { color: var(--paper); font-size: clamp(26px, 3vw, 34px); margin-bottom: 12px; }
    #zly-home-hy-all-services-cta .zhy-resources-head p { color: #c7d0d6; }
    #zly-home-hy-all-services-cta .zhy-resources-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; align-items: start; }
    #zly-home-hy-all-services-cta .zhy-guide-list { list-style: none; }
    #zly-home-hy-all-services-cta .zhy-guide-list li { border-bottom: 1px solid rgba(244,237,224,0.14); }
    #zly-home-hy-all-services-cta .zhy-guide-list li:last-child { border-bottom: none; }
    #zly-home-hy-all-services-cta .zhy-guide-link {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 18px 4px; color: var(--paper); text-decoration: none; font-weight: 600; font-size: 15.5px;
      transition: color 0.15s ease;
    }
    #zly-home-hy-all-services-cta .zhy-guide-link:hover { color: var(--marigold); }
    #zly-home-hy-all-services-cta .zhy-guide-link .arrow { color: var(--marigold); font-size: 18px; flex-shrink: 0; }
    #zly-home-hy-all-services-cta .zhy-newsletter {
      background: rgba(244,237,224,0.06); border: 1px solid rgba(244,237,224,0.16); border-radius: 12px;
      padding: 32px;
    }
    #zly-home-hy-all-services-cta .zhy-newsletter h3 { color: var(--paper); font-size: 19px; margin-bottom: 8px; }
    #zly-home-hy-all-services-cta .zhy-newsletter p { color: #c7d0d6; font-size: 14px; margin-bottom: 20px; }
    #zly-home-hy-all-services-cta .zhy-newsletter-form { display: flex; gap: 10px; flex-wrap: wrap; }
    #zly-home-hy-all-services-cta .zhy-input {
      flex: 1 1 200px; padding: 13px 16px; border-radius: 8px; border: 1px solid rgba(244,237,224,0.24);
      background: rgba(244,237,224,0.08); color: var(--paper); font-size: 14.5px; font-family: 'DM Sans', sans-serif;
    }
    #zly-home-hy-all-services-cta .zhy-input::placeholder { color: rgba(244,237,224,0.5); }
    #zly-home-hy-all-services-cta .zhy-input:focus { outline: 2px solid var(--marigold); outline-offset: 1px; }
    #zly-home-hy-all-services-cta .zhy-newsletter-form .zhy-btn { flex-shrink: 0; }
    #zly-home-hy-all-services-cta .zhy-newsletter .fine-print { font-size: 12px; color: rgba(244,237,224,0.5); margin-top: 12px; }

    /* ---------- FEATURED (Automation spotlight) ---------- */
    #zly-home-hy-all-services-cta .zhy-featured {
      background: var(--card, #fff9ef); border: 1px solid var(--border); border-radius: 18px;
      padding: 60px; display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 50px; align-items: center;
      box-shadow: 0 24px 48px -28px rgba(27,36,48,0.3);
    }
    #zly-home-hy-all-services-cta .zhy-featured .zhy-tag { color: var(--blue); }
    #zly-home-hy-all-services-cta .zhy-featured h2 { font-size: clamp(30px, 4vw, 44px); margin-bottom: 16px; }
    #zly-home-hy-all-services-cta .zhy-featured p { font-size: 16.5px; margin-bottom: 26px; max-width: 480px; }
    #zly-home-hy-all-services-cta .zhy-featured-stat { text-align: center; background: var(--paper-2); border-radius: 14px; padding: 40px 24px; }
    #zly-home-hy-all-services-cta .zhy-featured-stat .num { font-family: 'Newsreader', serif; font-weight: 600; font-size: clamp(48px, 6vw, 72px); color: var(--barn); line-height: 1; }
    #zly-home-hy-all-services-cta .zhy-featured-stat p { font-size: 14.5px; margin: 10px 0 0; max-width: none; }

    /* ---------- TESTIMONIALS (carousel) ---------- */
    #zly-home-hy-all-services-cta .zhy-test-head { text-align: center; max-width: 560px; margin: 0 auto 40px; }
    #zly-home-hy-all-services-cta .zhy-test-head h2 { font-size: clamp(26px, 3vw, 34px); }
    #zly-home-hy-all-services-cta .zhy-test-track {
      display: flex; gap: 22px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth;
      padding: 4px 4px 14px; scrollbar-width: none;
    }
    #zly-home-hy-all-services-cta .zhy-test-track::-webkit-scrollbar { display: none; }
    #zly-home-hy-all-services-cta .zhy-test-card {
      flex: 0 0 auto; width: min(340px, 80vw); scroll-snap-align: start;
      background: #fff9ef; border: 1px solid var(--border); border-radius: 12px;
      padding: 28px; display: flex; flex-direction: column;
    }
    #zly-home-hy-all-services-cta .zhy-test-card .stars { color: var(--marigold); font-size: 14px; letter-spacing: 2px; margin-bottom: 14px; }
    #zly-home-hy-all-services-cta .zhy-test-card p.quote { font-family: 'Newsreader', serif; font-style: italic; font-size: 16.5px; color: var(--ink); line-height: 1.5; flex-grow: 1; margin-bottom: 18px; }
    #zly-home-hy-all-services-cta .zhy-test-card .who { font-weight: 700; font-size: 14px; color: var(--ink); }
    #zly-home-hy-all-services-cta .zhy-test-card .who .biz { display: block; font-weight: 400; color: var(--ink-soft); font-size: 13px; margin-top: 2px; }
    #zly-home-hy-all-services-cta .zhy-test-card.is-placeholder {
      align-items: center; justify-content: center; text-align: center;
      border: 1.5px dashed var(--border); background: transparent; color: var(--ink-soft);
    }
    #zly-home-hy-all-services-cta .zhy-test-card.is-placeholder .plus { font-size: 26px; color: var(--barn); margin-bottom: 8px; }
    #zly-home-hy-all-services-cta .zhy-test-card.is-placeholder p { font-size: 14px; margin: 0; }
    #zly-home-hy-all-services-cta .zhy-test-nav { display: flex; justify-content: center; gap: 12px; margin-top: 8px; }
    #zly-home-hy-all-services-cta .zhy-test-nav button {
      width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--border);
      background: #fff9ef; cursor: pointer; font-size: 17px; color: var(--ink);
      transition: border-color 0.15s ease, color 0.15s ease;
    }
    #zly-home-hy-all-services-cta .zhy-test-nav button:hover { border-color: var(--barn); color: var(--barn); }

    /* ---------- WHO WE WORK WITH ---------- */
    #zly-home-hy-all-services-cta .zhy-work-head { text-align: center; max-width: 560px; margin: 0 auto 40px; }
    #zly-home-hy-all-services-cta .zhy-work-head h2 { font-size: clamp(24px, 2.8vw, 30px); }
    #zly-home-hy-all-services-cta .zhy-logos { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px; }
    #zly-home-hy-all-services-cta .zhy-logo-box {
      width: 168px; height: 76px; display: flex; align-items: center; justify-content: center;
      border: 1.5px dashed var(--border); border-radius: 10px; color: var(--ink-soft);
      font-size: 12.5px; font-weight: 600; text-align: center; letter-spacing: 0.02em; padding: 8px;
    }

    /* ---------- FINAL CTA ---------- */
    #zly-home-hy-all-services-cta .zhy-sign {
      background: var(--ink); border-radius: 14px; padding: 60px 40px; text-align: center;
      margin: 0 24px; max-width: 1112px; margin-left: auto; margin-right: auto;
      position: relative; overflow: hidden;
    }
    #zly-home-hy-all-services-cta .zhy-sign::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(circle at 25% 20%, rgba(108,92,231,0.25), transparent 55%),
                  radial-gradient(circle at 80% 85%, rgba(181,72,45,0.22), transparent 55%);
    }
    #zly-home-hy-all-services-cta .zhy-sign > * { position: relative; }
    #zly-home-hy-all-services-cta .zhy-sign h2 { color: var(--paper); font-size: clamp(28px, 3.2vw, 38px); margin-bottom: 14px; }
    #zly-home-hy-all-services-cta .zhy-sign p { color: #c7d0d6; max-width: 460px; margin: 0 auto 28px; }

    @media (max-width: 900px) {
      #zly-home-hy-all-services-cta .zhy-hero { grid-template-columns: 1fr; padding-top: 76px; }
      #zly-home-hy-all-services-cta .zhy-who { grid-template-columns: 1fr; gap: 32px; text-align: center; }
      #zly-home-hy-all-services-cta .zhy-who-media { order: -1; }
      #zly-home-hy-all-services-cta .zhy-resources-grid { grid-template-columns: 1fr; gap: 40px; }
      #zly-home-hy-all-services-cta .zhy-featured { grid-template-columns: 1fr; padding: 40px 28px; text-align: center; }
      #zly-home-hy-all-services-cta .zhy-featured p { margin-left: auto; margin-right: auto; }
      #zly-home-hy-all-services-cta .zhy-section { padding: 60px 20px; }
      #zly-home-hy-all-services-cta .zhy-rotate-band { padding: 60px 20px; }
      #zly-home-hy-all-services-cta .zhy-resources { padding: 60px 20px; }
    }
  </style>

  <div class="zhy-all-services">
    <a href="https://www.zoley.io/all-solutions" class="zhy-btn zhy-btn-ghost">All services</a>
  </div>
</div>
