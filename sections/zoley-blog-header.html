<!--
ZOLEY — BLOG PAGE — HEADER SECTION
-->

<div id="zly-blog-header">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&family=DM+Sans:wght@400;500;700&family=Caveat:wght@600;700&display=swap');

    #zly-blog-header {
      --paper: #faf3e7; --paper-2: #f6e4b8; --card: #fff9ef;
      --ink: #1b2430; --ink-soft: #5c6b76;
      --marigold: #e3a72e; --barn: #b5482d; --sage: #7a8b69; --violet: #6c5ce7; --blue: #4ea1ff;
      --border: rgba(27,36,48,0.14);
      font-family: 'DM Sans', sans-serif; background: var(--paper); color: var(--ink);
    }
    #zly-blog-header * { box-sizing: border-box; margin: 0; padding: 0; }
    #zly-blog-header .sec { padding: 90px 24px; max-width: 1160px; margin: 0 auto; }
    #zly-blog-header h1, #zly-blog-header h2, #zly-blog-header h3 { font-family: 'Newsreader', serif; font-weight: 600; line-height: 1.1; letter-spacing: -0.01em; color: var(--ink); }
    #zly-blog-header p { color: var(--ink-soft); line-height: 1.65; }
    #zly-blog-header .tag { font-family: 'Caveat', cursive; font-size: 21px; font-weight: 700; display: inline-block; transform: rotate(-2deg); margin-bottom: 12px; padding: 0 4px; color: var(--barn); }

    /* BUTTONS */
    #zly-blog-header .btn { display: inline-flex; align-items: center; gap: 8px; padding: 15px 28px; border-radius: 8px; font-weight: 700; font-size: 15.5px; text-decoration: none; transition: transform 0.15s ease, box-shadow 0.15s ease; }
    #zly-blog-header .btn-primary { background: var(--barn); color: #fff9ef; box-shadow: 0 4px 0 #7c2f19; }
    #zly-blog-header .btn-primary:hover { transform: translateY(2px); box-shadow: 0 2px 0 #7c2f19; }
    #zly-blog-header .btn-outline { background: transparent; color: #fff9ef; border: 2px solid var(--barn); }
    #zly-blog-header .btn-outline:hover { background: var(--barn); }

    /* HEADER */
    #zly-blog-header .hero { padding: 108px 24px 64px; max-width: 780px; margin: 0 auto; text-align: center; }
    #zly-blog-header .hero h1 { font-size: clamp(34px, 4.6vw, 54px); }
    #zly-blog-header .hero p.sub { font-size: 18.5px; max-width: 540px; margin: 20px auto 0; }

    /* SHARED POST BITS */
    #zly-blog-header .post-cat { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--barn); border: 1px solid var(--border); background: var(--paper); padding: 4px 10px; border-radius: 999px; margin-bottom: 14px; align-self: flex-start; }
    #zly-blog-header .post-link { font-weight: 700; color: var(--barn); text-decoration: none; border-bottom: 2px solid var(--barn); padding-bottom: 2px; align-self: flex-start; }

    /* FEATURED POST */
    #zly-blog-header .post-featured { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 40px; box-shadow: 0 18px 40px -24px rgba(27,36,48,0.25); display: grid; grid-template-columns: 1fr 1fr; gap: 44px; align-items: center; }
    #zly-blog-header .post-featured-media { width: 100%; aspect-ratio: 16 / 10; border-radius: 12px; overflow: hidden; background: linear-gradient(135deg, rgba(122,139,105,0.18), rgba(78,161,255,0.18)); display: flex; align-items: center; justify-content: center; text-align: center; padding: 20px; }
    #zly-blog-header .post-featured-media span { font-size: 13px; color: var(--ink-soft); font-style: italic; }
    #zly-blog-header .post-featured-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
    #zly-blog-header .post-featured-body { display: flex; flex-direction: column; }
    #zly-blog-header .post-featured-body h2 { font-size: clamp(24px, 2.6vw, 30px); margin-bottom: 12px; }
    #zly-blog-header .post-featured-body p { font-size: 15.5px; margin-bottom: 20px; }

    /* POST GRID */
    #zly-blog-header .post-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; }
    #zly-blog-header .post-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 24px; box-shadow: 0 14px 30px -20px rgba(27,36,48,0.2); display: flex; flex-direction: column; }
    #zly-blog-header .post-media { width: 100%; aspect-ratio: 4 / 3; border-radius: 10px; overflow: hidden; margin-bottom: 18px; background: linear-gradient(135deg, rgba(122,139,105,0.18), rgba(78,161,255,0.18)); display: flex; align-items: center; justify-content: center; text-align: center; padding: 16px; }
    #zly-blog-header .post-media span { font-size: 12.5px; color: var(--ink-soft); font-style: italic; }
    #zly-blog-header .post-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
    #zly-blog-header .post-card h3 { font-size: 17.5px; margin-bottom: 8px; }
    #zly-blog-header .post-card p { font-size: 13.5px; margin-bottom: 16px; flex-grow: 1; }

    /* FINAL CTA */
    #zly-blog-header .final { background: var(--ink); border-radius: 14px; padding: 60px 40px; text-align: center; margin: 0 24px; max-width: 1112px; margin-left: auto; margin-right: auto; position: relative; overflow: hidden; }
    #zly-blog-header .final::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 25% 20%, rgba(108,92,231,0.25), transparent 55%), radial-gradient(circle at 80% 85%, rgba(181,72,45,0.22), transparent 55%); }
    #zly-blog-header .final > * { position: relative; }
    #zly-blog-header .final h2 { color: var(--paper); font-size: clamp(27px, 3.2vw, 36px); margin-bottom: 14px; }
    #zly-blog-header .final p { color: #c7d0d6; max-width: 460px; margin: 0 auto 26px; }
    #zly-blog-header .final .btn-row { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }

    @media (max-width: 900px) {
      #zly-blog-header .post-featured { grid-template-columns: 1fr; }
      #zly-blog-header .post-grid { grid-template-columns: repeat(2, 1fr); }
      #zly-blog-header .sec { padding: 60px 20px; }
    }
    @media (max-width: 620px) {
      #zly-blog-header .post-grid { grid-template-columns: 1fr; }
    }
  </style>

  <!-- HEADER -->
  <section class="hero">
    <span class="tag">the zoley blog</span>
    <h1>Ideas for small businesses ready to grow.</h1>
    <p class="sub">Straight talk on AI, automation, design, advertising, and strategy — no jargon, no fluff.</p>
  </section>
</div>
