<!--
ZOLEY — QUICK START PAGE — HERO SECTION
-->

<div id="zly-quickstart-hero">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&family=DM+Sans:wght@400;500;700&family=Caveat:wght@600;700&display=swap');

    #zly-quickstart-hero {
      --paper: #faf3e7; --ink: #1b2430; --ink-soft: #5c6b76;
      --barn: #b5482d; --violet: #6c5ce7;
      font-family: 'DM Sans', sans-serif; background: var(--paper); color: var(--ink);
    }
    #zly-quickstart-hero * { box-sizing: border-box; margin: 0; padding: 0; }
    #zly-quickstart-hero h1 { font-family: 'Newsreader', serif; font-weight: 600; line-height: 1.1; letter-spacing: -0.01em; color: var(--ink); }
    #zly-quickstart-hero p { color: var(--ink-soft); line-height: 1.65; }
    #zly-quickstart-hero .tag { font-family: 'Caveat', cursive; font-size: 21px; font-weight: 700; display: inline-block; transform: rotate(-2deg); margin-bottom: 12px; padding: 0 4px; color: var(--barn); }

    #zly-quickstart-hero .hero { padding: 108px 24px 50px; max-width: 720px; margin: 0 auto; text-align: center; }
    #zly-quickstart-hero .hero h1 { font-size: clamp(32px, 4.4vw, 50px); }
    #zly-quickstart-hero .hero p.sub { font-size: 17.5px; max-width: 520px; margin: 20px auto 0; }

    @media (max-width: 900px) {
      #zly-quickstart-hero .hero { padding: 72px 20px 36px; }
    }
    @media (max-width: 480px) {
      #zly-quickstart-hero .hero { padding: 56px 18px 30px; }
    }
  </style>

  <section class="hero">
    <span class="tag">let's build your plan</span>
    <h1>Tell us about your business, we'll come back with a plan.</h1>
    <p class="sub">A few quick questions, no phone call required. We'll follow up with a plan and pricing shaped around what you actually need.</p>
  </section>
</div>
