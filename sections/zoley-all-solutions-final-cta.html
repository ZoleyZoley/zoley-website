ZOLEY — ALL SOLUTIONS PAGE — CLOSING CTA SECTION
-->

<div id="zly-sol-cta">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&family=DM+Sans:wght@400;500;700&family=Caveat:wght@600;700&display=swap');

    #zly-sol-cta {
      --paper: #faf3e7; --ink: #1b2430; --barn: #b5482d;
      font-family: 'DM Sans', sans-serif; background: var(--paper); color: var(--ink);
    }
    #zly-sol-cta * { box-sizing: border-box; margin: 0; padding: 0; }
    #zly-sol-cta .sec { padding: 20px 24px 90px; max-width: 1160px; margin: 0 auto; text-align: center; }
    #zly-sol-cta p { color: var(--ink-soft, #5c6b76); line-height: 1.65; }
    #zly-sol-cta .btn { display: inline-flex; align-items: center; gap: 8px; padding: 14px 26px; border-radius: 8px; font-weight: 700; font-size: 15px; text-decoration: none; transition: transform 0.15s ease, box-shadow 0.15s ease; }
    #zly-sol-cta .btn-primary { background: var(--barn); color: #fff9ef; box-shadow: 0 4px 0 #7c2f19; }
    #zly-sol-cta .btn-primary:hover { transform: translateY(2px); box-shadow: 0 2px 0 #7c2f19; }

    @media (max-width: 900px) {
      #zly-sol-cta .sec { padding: 16px 20px 64px; }
    }
    @media (max-width: 480px) {
      #zly-sol-cta .btn { width: 100%; justify-content: center; }
    }
  </style>

  <section class="sec">
    <p style="max-width: 460px; margin: 0 auto 20px; font-size: 15px;">Not sure which one fits? A quick call will sort it out fast.</p>
    <a href="https://calendly.com/zoley/free-30-min-discovery-call" class="btn btn-primary">Book a free call</a>
  </section>
</div>
