<!--
ZOLEY — ELEVATE YOUR BRAND PAGE — "AGENCY VS ZOLEY" BAND SECTION
-->

<div id="zly-elev-vs">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&family=DM+Sans:wght@400;500;700&family=Caveat:wght@600;700&display=swap');

    #zly-elev-vs {
      --paper: #faf3e7; --ink: #1b2430; --barn: #b5482d;
      font-family: 'DM Sans', sans-serif; background: var(--paper); color: var(--ink);
    }
    #zly-elev-vs * { box-sizing: border-box; margin: 0; padding: 0; }
    #zly-elev-vs .sec { padding: 0 24px 90px; max-width: 1160px; margin: 0 auto; }
    #zly-elev-vs h2 { font-family: 'Newsreader', serif; font-weight: 600; line-height: 1.1; letter-spacing: -0.01em; }
    #zly-elev-vs .btn { display: inline-flex; align-items: center; gap: 8px; padding: 15px 28px; border-radius: 8px; font-weight: 700; font-size: 15.5px; text-decoration: none; transition: transform 0.15s ease, box-shadow 0.15s ease; }
    #zly-elev-vs .btn-primary { background: var(--barn); color: #fff9ef; box-shadow: 0 4px 0 #7c2f19; }
    #zly-elev-vs .btn-primary:hover { transform: translateY(2px); box-shadow: 0 2px 0 #7c2f19; }

    #zly-elev-vs .vs-band { background: var(--ink); border-radius: 14px; padding: 56px 40px; text-align: center; margin: 0 24px; max-width: 1112px; margin-left: auto; margin-right: auto; position: relative; overflow: hidden; }
    #zly-elev-vs .vs-band::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 25% 20%, rgba(108,92,231,0.25), transparent 55%), radial-gradient(circle at 80% 85%, rgba(181,72,45,0.22), transparent 55%); }
    #zly-elev-vs .vs-band > * { position: relative; }
    #zly-elev-vs .vs-band h2 { color: var(--paper); font-size: clamp(26px, 3vw, 36px); margin-bottom: 24px; max-width: 620px; margin-left: auto; margin-right: auto; }
    #zly-elev-vs .vs-band .btn-primary { margin-top: 4px; }

    @media (max-width: 900px) {
      #zly-elev-vs .sec { padding: 0 20px 60px; }
      #zly-elev-vs .vs-band { padding: 44px 26px; }
    }
    @media (max-width: 480px) {
      #zly-elev-vs .vs-band { padding: 36px 22px; border-radius: 12px; }
      #zly-elev-vs .btn { width: 100%; justify-content: center; }
    }
  </style>

  <section class="sec">
    <div class="vs-band">
      <h2>Big brands have full teams and agencies. You have Zoley.</h2>
      <a href="https://www.zoley.io/find-your-next-best-business-move" class="btn btn-primary">Let's work together</a>
    </div>
  </section>
</div>
