<!--
ZOLEY HOMEPAGE — HERO SECTION
-->

<div id="zly-home-hero">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&family=DM+Sans:wght@400;500;700&family=Caveat:wght@600;700&display=swap');

    #zly-home-hero {
      --paper: #faf3e7;
      --paper-2: #f6e4b8;
      --ink: #1b2430;
      --ink-soft: #5c6b76;
      --marigold: #e3a72e;
      --barn: #b5482d;
      --sage: #7a8b69;
      --violet: #6c5ce7;
      --blue: #4ea1ff;
      --border: rgba(27,36,48,0.14);
      font-family: 'DM Sans', -apple-system, sans-serif;
      background: var(--paper);
      color: var(--ink);
    }
    #zly-home-hero * { box-sizing: border-box; }
    #zly-home-hero h1 { font-family: 'Newsreader', serif; font-weight: 600; line-height: 1.1; letter-spacing: -0.01em; color: var(--ink); }
    #zly-home-hero p { color: var(--ink-soft); line-height: 1.65; }
    #zly-home-hero .zhy-tag {
      font-family: 'Caveat', cursive; font-size: 22px; font-weight: 700;
      color: var(--barn);
      display: inline-block; transform: rotate(-2deg); margin-bottom: 10px; padding: 0 4px;
    }

    #zly-home-hero .zhy-hero { padding: 112px 24px 60px; max-width: 1160px; margin: 0 auto; display: grid; grid-template-columns: 1.05fr 0.95fr; gap: 50px; align-items: center; }
    #zly-home-hero .zhy-hero h1 { font-size: clamp(36px, 4.6vw, 58px); }
    #zly-home-hero .underline { position: relative; display: inline-block; }
    #zly-home-hero .underline svg { position: absolute; left: 0; bottom: -6px; width: 100%; height: 14px; }
    #zly-home-hero p.zhy-sub { font-size: 18.5px; margin: 22px 0 30px; max-width: 470px; }
    #zly-home-hero .zhy-cta-row { display: flex; gap: 14px; flex-wrap: wrap; }
    #zly-home-hero .zhy-btn {
      display: inline-flex; align-items: center; gap: 8px; padding: 15px 28px;
      border-radius: 8px; font-weight: 700; font-size: 15.5px; text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease; cursor: pointer; font-family: 'DM Sans', sans-serif;
    }
    #zly-home-hero .zhy-btn-primary { background: var(--barn); color: #fff9ef; box-shadow: 0 4px 0 #7c2f19; }
    #zly-home-hero .zhy-btn-primary:hover { transform: translateY(2px); box-shadow: 0 2px 0 #7c2f19; }
    #zly-home-hero .zhy-btn-ghost { background: transparent; color: var(--ink); border: 2px solid var(--ink); }
    #zly-home-hero .zhy-btn-ghost:hover { background: var(--ink); color: var(--paper); }

    /* Signature: corkboard with pinned shop + network threads connecting service nodes */
    #zly-home-hero .zhy-board {
      background: var(--paper-2); border: 1px solid var(--border); border-radius: 14px;
      padding: 20px; position: relative;
    }
    #zly-home-hero .zhy-board svg { width: 100%; height: auto; display: block; }
    #zly-home-hero .zhy-thread { stroke: url(#zhy-thread-grad); stroke-width: 2; stroke-dasharray: 5 5; fill: none; opacity: 0.75; }
    #zly-home-hero .zhy-pulse { animation: zhy-pulse 3s ease-in-out infinite; transform-origin: center; }
    #zly-home-hero .zhy-pulse:nth-child(2) { animation-delay: 0.5s; }
    #zly-home-hero .zhy-pulse:nth-child(3) { animation-delay: 1s; }
    @keyframes zhy-pulse { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { #zly-home-hero .zhy-pulse { animation: none; } }

    @media (max-width: 900px) {
      #zly-home-hero .zhy-hero { grid-template-columns: 1fr; padding: 76px 20px 40px; }
    }
    @media (max-width: 480px) {
      #zly-home-hero .zhy-hero { padding-top: 56px; gap: 34px; }
      #zly-home-hero .zhy-cta-row { flex-direction: column; align-items: stretch; }
      #zly-home-hero .zhy-btn { justify-content: center; }
    }
  </style>

  <section class="zhy-hero">
    <div>
      <span class="zhy-tag">local, but wired in</span>
      <h1>Your business stays personal.<br>The <span class="underline">systems<svg viewBox="0 0 200 14" preserveAspectRatio="none"><path d="M2 10 Q 50 2, 100 8 T 198 6" stroke="#e3a72e" stroke-width="5" fill="none" stroke-linecap="round"/></svg></span> do the rest.</h1>
      <p class="zhy-sub">A website, a way to be found nearby, and the busywork automated behind the scenes, all built so it still feels like you, not a tech company.</p>
      <div class="zhy-cta-row">
        <a href="https://calendly.com/zoley/free-30-min-discovery-call" class="zhy-btn zhy-btn-primary">Book a free chat</a>
        <a href="https://www.zoley.io/find-your-next-best-business-move" class="zhy-btn zhy-btn-ghost">Tell us about your business</a>
      </div>
    </div>
    <div class="zhy-board">
      <svg viewBox="0 0 400 320" fill="none">
        <defs>
          <linearGradient id="zhy-thread-grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#b5482d"/>
            <stop offset="1" stop-color="#6c5ce7"/>
          </linearGradient>
        </defs>
        <!-- storefront card -->
        <rect x="30" y="40" width="150" height="110" rx="3" fill="#fff9ef" stroke="#1b2430" stroke-width="2.5"/>
        <path d="M30 60 L105 30 L180 60" stroke="#1b2430" stroke-width="2.5" fill="none"/>
        <rect x="55" y="90" width="40" height="40" fill="#e3a72e" stroke="#1b2430" stroke-width="2"/>
        <rect x="115" y="90" width="40" height="40" fill="#7a8b69" stroke="#1b2430" stroke-width="2"/>
        <!-- website node -->
        <rect x="230" y="30" width="140" height="90" rx="3" fill="#fff9ef" stroke="#1b2430" stroke-width="2.5"/>
        <line x1="230" y1="50" x2="370" y2="50" stroke="#1b2430" stroke-width="2"/>
        <circle cx="242" cy="40" r="3" fill="#b5482d"/>
        <circle cx="253" cy="40" r="3" fill="#e3a72e"/>
        <circle cx="264" cy="40" r="3" fill="#7a8b69"/>
        <!-- map pin node -->
        <circle cx="300" cy="220" r="46" fill="#fff9ef" stroke="#1b2430" stroke-width="2.5"/>
        <path d="M300 198 C 312 198 320 208 320 218 C 320 232 300 246 300 246 C 300 246 280 232 280 218 C 280 208 288 198 300 198 Z" stroke="#6c5ce7" stroke-width="2.5" fill="none"/>
        <!-- clock node -->
        <circle cx="90" cy="240" r="40" fill="#fff9ef" stroke="#1b2430" stroke-width="2.5"/>
        <circle cx="90" cy="240" r="20" stroke="#b5482d" stroke-width="2.2" fill="none"/>
        <line x1="90" y1="240" x2="90" y2="228" stroke="#b5482d" stroke-width="2.2"/>
        <line x1="90" y1="240" x2="99" y2="245" stroke="#b5482d" stroke-width="2.2"/>
        <!-- connecting threads -->
        <path class="zhy-thread" d="M170 90 Q 200 100 240 80"/>
        <path class="zhy-thread" d="M110 145 Q 140 190 130 220"/>
        <path class="zhy-thread" d="M270 200 Q 260 150 270 120"/>
        <path class="zhy-thread" d="M170 235 Q 220 245 254 225"/>
        <!-- pins -->
        <circle class="zhy-pulse" cx="170" cy="90" r="5" fill="#b5482d"/>
        <circle class="zhy-pulse" cx="270" cy="120" r="5" fill="#6c5ce7"/>
        <circle class="zhy-pulse" cx="130" cy="220" r="5" fill="#e3a72e"/>
      </svg>
    </div>
  </section>
</div>
