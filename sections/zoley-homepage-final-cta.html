<!--
ZOLEY HOMEPAGE — FINAL CTA SECTION
-->

<div id="zly-home-cta">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&family=DM+Sans:wght@400;500;700&family=Caveat:wght@600;700&display=swap');

    #zly-home-cta {
      --paper: #faf3e7;
      --ink: #1b2430;
      --barn: #b5482d;
      --violet: #6c5ce7;
      font-family: 'DM Sans', -apple-system, sans-serif;
      background: var(--paper);
      color: var(--ink);
    }
    #zly-home-cta * { box-sizing: border-box; }
    #zly-home-cta .zhy-section { padding: 90px 24px 96px; max-width: 1160px; margin: 0 auto; }
    #zly-home-cta h2 { font-family: 'Newsreader', serif; font-weight: 600; line-height: 1.1; letter-spacing: -0.01em; }
    #zly-home-cta .zhy-cta-row { display: flex; gap: 14px; flex-wrap: wrap; }
    #zly-home-cta .zhy-btn {
      display: inline-flex; align-items: center; gap: 8px; padding: 15px 28px;
      border-radius: 8px; font-weight: 700; font-size: 15.5px; text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease; cursor: pointer; font-family: 'DM Sans', sans-serif;
    }
    #zly-home-cta .zhy-btn-primary { background: var(--barn); color: #fff9ef; box-shadow: 0 4px 0 #7c2f19; }
    #zly-home-cta .zhy-btn-primary:hover { transform: translateY(2px); box-shadow: 0 2px 0 #7c2f19; }
    #zly-home-cta .zhy-btn-ghost { background: transparent; border: 2px solid var(--ink); }

    #zly-home-cta .zhy-sign {
      background: var(--ink); border-radius: 14px; padding: 60px 40px; text-align: center;
      margin: 0 24px; max-width: 1112px; margin-left: auto; margin-right: auto;
      position: relative; overflow: hidden;
    }
    #zly-home-cta .zhy-sign::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(circle at 25% 20%, rgba(108,92,231,0.25), transparent 55%),
                  radial-gradient(circle at 80% 85%, rgba(181,72,45,0.22), transparent 55%);
    }
    #zly-home-cta .zhy-sign > * { position: relative; }
    #zly-home-cta .zhy-sign h2 { color: var(--paper); font-size: clamp(28px, 3.2vw, 38px); margin-bottom: 14px; }
    #zly-home-cta .zhy-sign p { color: #c7d0d6; max-width: 460px; margin: 0 auto 28px; line-height: 1.65; }

    @media (max-width: 900px) {
      #zly-home-cta .zhy-section { padding: 60px 20px 64px; }
      #zly-home-cta .zhy-sign { padding: 48px 28px; }
    }
    @media (max-width: 480px) {
      #zly-home-cta .zhy-sign { padding: 40px 22px; border-radius: 12px; }
      #zly-home-cta .zhy-cta-row { flex-direction: column; align-items: stretch; }
      #zly-home-cta .zhy-btn { justify-content: center; }
    }
  </style>

  <section class="zhy-section">
    <div class="zhy-sign">
      <h2>Let's get your business set up right.</h2>
      <p>No pressure, no pitch. Just a real conversation about what would actually help.</p>
      <div class="zhy-cta-row" style="justify-content: center;">
        <a href="https://calendly.com/zoley/free-30-min-discovery-call" class="zhy-btn zhy-btn-primary">Book a free chat</a>
        <a href="https://www.zoley.io/find-your-next-best-business-move" class="zhy-btn zhy-btn-ghost" style="color:#faf3e7; border-color:#faf3e7;">Tell us about your business</a>
      </div>
    </div>
  </section>
</div>
