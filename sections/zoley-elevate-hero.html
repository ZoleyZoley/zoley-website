<!--
ZOLEY — ELEVATE YOUR BRAND PAGE — HERO SECTION
-->

<div id="zly-elev-hero">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&family=DM+Sans:wght@400;500;700&family=Caveat:wght@600;700&display=swap');

    #zly-elev-hero {
      --paper: #faf3e7; --ink: #1b2430; --ink-soft: #5c6b76;
      --barn: #b5482d; --violet: #6c5ce7;
      font-family: 'DM Sans', sans-serif; background: var(--paper); color: var(--ink);
    }
    #zly-elev-hero * { box-sizing: border-box; margin: 0; padding: 0; }
    #zly-elev-hero h1 { font-family: 'Newsreader', serif; font-weight: 600; line-height: 1.1; letter-spacing: -0.01em; color: var(--ink); }
    #zly-elev-hero p { color: var(--ink-soft); line-height: 1.65; }
    #zly-elev-hero .tag { font-family: 'Caveat', cursive; font-size: 21px; font-weight: 700; display: inline-block; transform: rotate(-2deg); margin-bottom: 12px; padding: 0 4px; color: var(--barn); }
    #zly-elev-hero .btn { display: inline-flex; align-items: center; gap: 8px; padding: 15px 28px; border-radius: 8px; font-weight: 700; font-size: 15.5px; text-decoration: none; transition: transform 0.15s ease, box-shadow 0.15s ease; }
    #zly-elev-hero .btn-primary { background: var(--barn); color: #fff9ef; box-shadow: 0 4px 0 #7c2f19; }
    #zly-elev-hero .btn-primary:hover { transform: translateY(2px); box-shadow: 0 2px 0 #7c2f19; }

    #zly-elev-hero .hero { padding: 108px 24px 70px; max-width: 780px; margin: 0 auto; text-align: center; }
    #zly-elev-hero .hero h1 { font-size: clamp(34px, 4.6vw, 54px); }
    #zly-elev-hero .hero p.sub { font-size: 18.5px; max-width: 520px; margin: 20px auto 30px; }

    @media (max-width: 900px) {
      #zly-elev-hero .hero { padding: 72px 20px 48px; }
    }
    @media (max-width: 480px) {
      #zly-elev-hero .hero { padding: 56px 18px 40px; }
      #zly-elev-hero .btn { width: 100%; justify-content: center; }
    }
  </style>

  <section class="hero">
    <span class="tag">elevate your brand</span>
    <h1>Your brand deserves to stand out.</h1>
    <p class="sub">Attract the right audience and stop looking like you're stuck in 2015, without hiring a full agency to get there.</p>
    <a href="https://www.zoley.io/find-your-next-best-business-move" class="btn btn-primary">Request a brand audit</a>
  </section>
</div>
