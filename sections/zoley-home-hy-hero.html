<!--
ZOLEY — HOMEPAGE — HERO SECTION
-->

<div id="zly-home-hy-hero">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&family=DM+Sans:wght@400;500;700&family=Caveat:wght@600;700&display=swap');

    #zly-home-hy-hero {
      --paper: #faf3e7;
      --paper-2: #f6e4b8;
      --ink: #1b2430;
      --ink-soft: #5c6b76;
      --marigold: #e3a72e;
      --barn: #b5482d;
      --sage: #7a8b69;
      --violet: #6c5ce7;
      --blue: #4ea1ff;
      --border: rgba(27,36,48,0.14);
      font-family: 'DM Sans', -apple-system, sans-serif;
      background: var(--paper);
      color: var(--ink);
    }
    #zly-home-hy-hero * { box-sizing: border-box; }
    #zly-home-hy-hero .zhy-section { padding: 90px 24px; max-width: 1160px; margin: 0 auto; }
    #zly-home-hy-hero h1, #zly-home-hy-hero h2, #zly-home-hy-hero h3 { font-family: 'Newsreader', serif; font-weight: 600; line-height: 1.1; letter-spacing: -0.01em; color: var(--ink); }
    #zly-home-hy-hero p { color: var(--ink-soft); line-height: 1.65; }
    #zly-home-hy-hero .zhy-tag {
      font-family: 'Caveat', cursive; font-size: 22px; font-weight: 700;
      color: var(--barn);
      display: inline-block; transform: rotate(-2deg); margin-bottom: 10px; padding: 0 4px;
    }

    /* ---------- HERO ---------- */
    #zly-home-hy-hero .zhy-hero { padding: 112px 24px 60px; max-width: 1160px; margin: 0 auto; display: grid; grid-template-columns: 1.05fr 0.95fr; gap: 50px; align-items: center; }
    #zly-home-hy-hero .zhy-hero h1 { font-size: clamp(36px, 4.6vw, 58px); }
    #zly-home-hy-hero .zhy-hero p.zhy-sub { font-size: 18.5px; margin: 22px 0 30px; max-width: 470px; }
    #zly-home-hy-hero .zhy-cta-row { display: flex; gap: 14px; flex-wrap: wrap; }
    #zly-home-hy-hero .zhy-btn {
      display: inline-flex; align-items: center; gap: 8px; padding: 15px 28px;
      border-radius: 8px; font-weight: 700; font-size: 15.5px; text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease; cursor: pointer; font-family: 'DM Sans', sans-serif;
    }
    #zly-home-hy-hero .zhy-btn-primary { background: var(--barn); color: #fff9ef; box-shadow: 0 4px 0 #7c2f19; }
    #zly-home-hy-hero .zhy-btn-primary:hover { transform: translateY(2px); box-shadow: 0 2px 0 #7c2f19; }
    #zly-home-hy-hero .zhy-btn-ghost { background: transparent; color: var(--ink); border: 2px solid var(--ink); }
    #zly-home-hy-hero .zhy-btn-ghost:hover { background: var(--ink); color: var(--paper); }

    /* Signature: corkboard with pinned icons + network threads connecting them */
    #zly-home-hy-hero .zhy-board {
      background: var(--paper-2); border: 1px solid var(--border); border-radius: 14px;
      padding: 20px; position: relative;
    }
    #zly-home-hy-hero .zhy-board svg { width: 100%; height: auto; display: block; }
    #zly-home-hy-hero .zhy-thread { stroke: url(#zhy-thread-grad); stroke-width: 2; stroke-dasharray: 5 5; fill: none; opacity: 0.75; }
    #zly-home-hy-hero .zhy-pulse { animation: zhy-pulse 3s ease-in-out infinite; transform-origin: center; }
    #zly-home-hy-hero .zhy-pulse:nth-child(2) { animation-delay: 0.5s; }
    #zly-home-hy-hero .zhy-pulse:nth-child(3) { animation-delay: 1s; }
    @keyframes zhy-pulse { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { #zly-home-hy-hero .zhy-pulse { animation: none; } }

    /* ---------- SERVICES ---------- */
    #zly-home-hy-hero .zhy-services-head { text-align: center; max-width: 640px; margin: 0 auto 40px; }
    #zly-home-hy-hero .zhy-services-cards { display: flex; flex-wrap: wrap; justify-content: center; gap: 24px; }
    #zly-home-hy-hero .zhy-card {
      background: #fff9ef; border: 1px solid var(--border); border-radius: 10px;
      padding: 30px; text-align: left; position: relative; overflow: hidden;
      flex: 1 1 280px; max-width: 320px; text-decoration: none; display: block; color: inherit;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }
    #zly-home-hy-hero .zhy-card::after {
      content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px;
      background: var(--zhy-card-accent, var(--barn));
    }
    #zly-home-hy-hero .zhy-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 18px 32px -16px rgba(27,36,48,0.28);
      border-color: rgba(27,36,48,0.28);
    }
    #zly-home-hy-hero .zhy-card svg { width: 44px; height: 44px; margin-bottom: 16px; }
    #zly-home-hy-hero .zhy-card h3 { font-size: 20px; margin-bottom: 8px; }
    #zly-home-hy-hero .zhy-card p { font-size: 14.5px; margin: 0; }

    /* ---------- ROTATING TEXT (plain, sits right under Services) ---------- */
    #zly-home-hy-hero .zhy-rotate-band { padding: 50px 24px 80px; }
    #zly-home-hy-hero .zhy-rotate-wrapper { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; max-width: 900px; margin: 0 auto; }
    #zly-home-hy-hero .zhy-static-text { font-family: 'Newsreader', serif; font-weight: 600; font-size: clamp(30px, 5vw, 52px); margin-bottom: 16px; color: var(--barn); line-height: 1.1; }
    #zly-home-hy-hero .zhy-changing-word { font-family: 'Newsreader', serif; font-weight: 600; font-size: clamp(30px, 5vw, 52px); line-height: 1.2; color: var(--ink); }
    #zly-home-hy-hero .zhy-cursor { font-family: 'Newsreader', serif; font-size: clamp(30px, 5vw, 52px); color: var(--ink-soft); animation: zhy-blink 1s step-start infinite; }
    @keyframes zhy-blink { 50% { opacity: 0; } }
    @media (max-width: 480px) { #zly-home-hy-hero .zhy-static-text { margin-bottom: 22px; } }
    @media (prefers-reduced-motion: reduce) { #zly-home-hy-hero .zhy-cursor { animation: none; } }

    #zly-home-hy-hero .zhy-all-services { text-align: center; padding: 44px 24px; }

    /* ---------- WHO WE ARE ---------- */
    #zly-home-hy-hero .zhy-who { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center; }
    #zly-home-hy-hero .zhy-who h2 { font-size: clamp(30px, 3.6vw, 42px); margin-bottom: 20px; }
    #zly-home-hy-hero .zhy-who p { font-size: 17.5px; }
    #zly-home-hy-hero .zhy-who-media {
      aspect-ratio: 4 / 3; border-radius: 16px; overflow: hidden;
      background: linear-gradient(135deg, rgba(122,139,105,0.18), rgba(78,161,255,0.18));
      display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px;
    }
    #zly-home-hy-hero .zhy-who-media span { font-size: 13.5px; color: var(--ink-soft); font-style: italic; }
    #zly-home-hy-hero .zhy-who-media img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* ---------- RESOURCES (color break) ---------- */
    #zly-home-hy-hero .zhy-resources { background: var(--ink); padding: 90px 24px; position: relative; overflow: hidden; }
    #zly-home-hy-hero .zhy-resources::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 15% 15%, rgba(181,72,45,0.2), transparent 55%), radial-gradient(circle at 90% 85%, rgba(78,161,255,0.18), transparent 55%); }
    #zly-home-hy-hero .zhy-resources-inner { position: relative; max-width: 1160px; margin: 0 auto; }
    #zly-home-hy-hero .zhy-resources-head { max-width: 620px; margin: 0 auto 48px; text-align: center; }
    #zly-home-hy-hero .zhy-resources-head .zhy-tag { color: var(--marigold); }
    #zly-home-hy-hero .zhy-resources-head h2 { color: var(--paper); font-size: clamp(26px, 3vw, 34px); margin-bottom: 12px; }
    #zly-home-hy-hero .zhy-resources-head p { color: #c7d0d6; }
    #zly-home-hy-hero .zhy-resources-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; align-items: start; }
    #zly-home-hy-hero .zhy-guide-list { list-style: none; }
    #zly-home-hy-hero .zhy-guide-list li { border-bottom: 1px solid rgba(244,237,224,0.14); }
    #zly-home-hy-hero .zhy-guide-list li:last-child { border-bottom: none; }
    #zly-home-hy-hero .zhy-guide-link {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 18px 4px; color: var(--paper); text-decoration: none; font-weight: 600; font-size: 15.5px;
      transition: color 0.15s ease;
    }
    #zly-home-hy-hero .zhy-guide-link:hover { color: var(--marigold); }
    #zly-home-hy-hero .zhy-guide-link .arrow { color: var(--marigold); font-size: 18px; flex-shrink: 0; }
    #zly-home-hy-hero .zhy-newsletter {
      background: rgba(244,237,224,0.06); border: 1px solid rgba(244,237,224,0.16); border-radius: 12px;
      padding: 32px;
    }
    #zly-home-hy-hero .zhy-newsletter h3 { color: var(--paper); font-size: 19px; margin-bottom: 8px; }
    #zly-home-hy-hero .zhy-newsletter p { color: #c7d0d6; font-size: 14px; margin-bottom: 20px; }
    #zly-home-hy-hero .zhy-newsletter-form { display: flex; gap: 10px; flex-wrap: wrap; }
    #zly-home-hy-hero .zhy-input {
      flex: 1 1 200px; padding: 13px 16px; border-radius: 8px; border: 1px solid rgba(244,237,224,0.24);
      background: rgba(244,237,224,0.08); color: var(--paper); font-size: 14.5px; font-family: 'DM Sans', sans-serif;
    }
    #zly-home-hy-hero .zhy-input::placeholder { color: rgba(244,237,224,0.5); }
    #zly-home-hy-hero .zhy-input:focus { outline: 2px solid var(--marigold); outline-offset: 1px; }
    #zly-home-hy-hero .zhy-newsletter-form .zhy-btn { flex-shrink: 0; }
    #zly-home-hy-hero .zhy-newsletter .fine-print { font-size: 12px; color: rgba(244,237,224,0.5); margin-top: 12px; }

    /* ---------- FEATURED (Automation spotlight) ---------- */
    #zly-home-hy-hero .zhy-featured {
      background: var(--card, #fff9ef); border: 1px solid var(--border); border-radius: 18px;
      padding: 60px; display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 50px; align-items: center;
      box-shadow: 0 24px 48px -28px rgba(27,36,48,0.3);
    }
    #zly-home-hy-hero .zhy-featured .zhy-tag { color: var(--blue); }
    #zly-home-hy-hero .zhy-featured h2 { font-size: clamp(30px, 4vw, 44px); margin-bottom: 16px; }
    #zly-home-hy-hero .zhy-featured p { font-size: 16.5px; margin-bottom: 26px; max-width: 480px; }
    #zly-home-hy-hero .zhy-featured-stat { text-align: center; background: var(--paper-2); border-radius: 14px; padding: 40px 24px; }
    #zly-home-hy-hero .zhy-featured-stat .num { font-family: 'Newsreader', serif; font-weight: 600; font-size: clamp(48px, 6vw, 72px); color: var(--barn); line-height: 1; }
    #zly-home-hy-hero .zhy-featured-stat p { font-size: 14.5px; margin: 10px 0 0; max-width: none; }

    /* ---------- TESTIMONIALS (carousel) ---------- */
    #zly-home-hy-hero .zhy-test-head { text-align: center; max-width: 560px; margin: 0 auto 40px; }
    #zly-home-hy-hero .zhy-test-head h2 { font-size: clamp(26px, 3vw, 34px); }
    #zly-home-hy-hero .zhy-test-track {
      display: flex; gap: 22px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth;
      padding: 4px 4px 14px; scrollbar-width: none;
    }
    #zly-home-hy-hero .zhy-test-track::-webkit-scrollbar { display: none; }
    #zly-home-hy-hero .zhy-test-card {
      flex: 0 0 auto; width: min(340px, 80vw); scroll-snap-align: start;
      background: #fff9ef; border: 1px solid var(--border); border-radius: 12px;
      padding: 28px; display: flex; flex-direction: column;
    }
    #zly-home-hy-hero .zhy-test-card .stars { color: var(--marigold); font-size: 14px; letter-spacing: 2px; margin-bottom: 14px; }
    #zly-home-hy-hero .zhy-test-card p.quote { font-family: 'Newsreader', serif; font-style: italic; font-size: 16.5px; color: var(--ink); line-height: 1.5; flex-grow: 1; margin-bottom: 18px; }
    #zly-home-hy-hero .zhy-test-card .who { font-weight: 700; font-size: 14px; color: var(--ink); }
    #zly-home-hy-hero .zhy-test-card .who .biz { display: block; font-weight: 400; color: var(--ink-soft); font-size: 13px; margin-top: 2px; }
    #zly-home-hy-hero .zhy-test-card.is-placeholder {
      align-items: center; justify-content: center; text-align: center;
      border: 1.5px dashed var(--border); background: transparent; color: var(--ink-soft);
    }
    #zly-home-hy-hero .zhy-test-card.is-placeholder .plus { font-size: 26px; color: var(--barn); margin-bottom: 8px; }
    #zly-home-hy-hero .zhy-test-card.is-placeholder p { font-size: 14px; margin: 0; }
    #zly-home-hy-hero .zhy-test-nav { display: flex; justify-content: center; gap: 12px; margin-top: 8px; }
    #zly-home-hy-hero .zhy-test-nav button {
      width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--border);
      background: #fff9ef; cursor: pointer; font-size: 17px; color: var(--ink);
      transition: border-color 0.15s ease, color 0.15s ease;
    }
    #zly-home-hy-hero .zhy-test-nav button:hover { border-color: var(--barn); color: var(--barn); }

    /* ---------- WHO WE WORK WITH ---------- */
    #zly-home-hy-hero .zhy-work-head { text-align: center; max-width: 560px; margin: 0 auto 40px; }
    #zly-home-hy-hero .zhy-work-head h2 { font-size: clamp(24px, 2.8vw, 30px); }
    #zly-home-hy-hero .zhy-logos { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px; }
    #zly-home-hy-hero .zhy-logo-box {
      width: 168px; height: 76px; display: flex; align-items: center; justify-content: center;
      border: 1.5px dashed var(--border); border-radius: 10px; color: var(--ink-soft);
      font-size: 12.5px; font-weight: 600; text-align: center; letter-spacing: 0.02em; padding: 8px;
    }

    /* ---------- FINAL CTA ---------- */
    #zly-home-hy-hero .zhy-sign {
      background: var(--ink); border-radius: 14px; padding: 60px 40px; text-align: center;
      margin: 0 24px; max-width: 1112px; margin-left: auto; margin-right: auto;
      position: relative; overflow: hidden;
    }
    #zly-home-hy-hero .zhy-sign::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(circle at 25% 20%, rgba(108,92,231,0.25), transparent 55%),
                  radial-gradient(circle at 80% 85%, rgba(181,72,45,0.22), transparent 55%);
    }
    #zly-home-hy-hero .zhy-sign > * { position: relative; }
    #zly-home-hy-hero .zhy-sign h2 { color: var(--paper); font-size: clamp(28px, 3.2vw, 38px); margin-bottom: 14px; }
    #zly-home-hy-hero .zhy-sign p { color: #c7d0d6; max-width: 460px; margin: 0 auto 28px; }

    @media (max-width: 900px) {
      #zly-home-hy-hero .zhy-hero { grid-template-columns: 1fr; padding-top: 76px; }
      #zly-home-hy-hero .zhy-who { grid-template-columns: 1fr; gap: 32px; text-align: center; }
      #zly-home-hy-hero .zhy-who-media { order: -1; }
      #zly-home-hy-hero .zhy-resources-grid { grid-template-columns: 1fr; gap: 40px; }
      #zly-home-hy-hero .zhy-featured { grid-template-columns: 1fr; padding: 40px 28px; text-align: center; }
      #zly-home-hy-hero .zhy-featured p { margin-left: auto; margin-right: auto; }
      #zly-home-hy-hero .zhy-section { padding: 60px 20px; }
      #zly-home-hy-hero .zhy-rotate-band { padding: 60px 20px; }
      #zly-home-hy-hero .zhy-resources { padding: 60px 20px; }
    }
  </style>

  <!-- 1. HERO -->
  <section class="zhy-hero">
    <div>
      <span class="zhy-tag">local, but wired in</span>
      <h1>We take what's slowing your business down, and turn it into what moves it forward.</h1>
      <p class="zhy-sub">The businesses pulling ahead tend to have solid systems behind them. We build the strategy, tools, and automation that get you there.</p>
      <div class="zhy-cta-row">
        <a href="https://calendly.com/zoley/free-30-min-discovery-call" class="zhy-btn zhy-btn-primary">Book a free chat</a>
        <a href="https://www.zoley.io/find-your-next-best-business-move" class="zhy-btn zhy-btn-ghost">Tell us about your business</a>
      </div>
    </div>
    <div class="zhy-board">
      <svg viewBox="0 0 400 320" fill="none">
        <defs>
          <linearGradient id="zhy-thread-grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#b5482d"/>
            <stop offset="1" stop-color="#6c5ce7"/>
          </linearGradient>
          <!-- website: browser window -->
          <symbol id="zhy-ico-website" viewBox="0 0 150 96">
            <rect x="1" y="1" width="148" height="94" rx="4" fill="#fff9ef" stroke="#1b2430" stroke-width="2.5"/>
            <line x1="1" y1="22" x2="149" y2="22" stroke="#1b2430" stroke-width="2"/>
            <circle cx="14" cy="11.5" r="3" fill="#b5482d"/>
            <circle cx="26" cy="11.5" r="3" fill="#e3a72e"/>
            <circle cx="38" cy="11.5" r="3" fill="#7a8b69"/>
            <rect x="14" y="36" width="90" height="8" rx="4" fill="#4ea1ff"/>
            <rect x="14" y="52" width="122" height="6" rx="3" fill="#1b2430" opacity="0.35"/>
            <rect x="14" y="66" width="96" height="6" rx="3" fill="#1b2430" opacity="0.35"/>
            <rect x="14" y="80" width="60" height="6" rx="3" fill="#1b2430" opacity="0.35"/>
          </symbol>
          <!-- database: stacked cylinder -->
          <symbol id="zhy-ico-database" viewBox="0 0 90 96">
            <ellipse cx="45" cy="14" rx="43" ry="13" fill="#f6e4b8" stroke="#1b2430" stroke-width="2.5"/>
            <path d="M2 14 L2 82 A43 13 0 0 0 88 82 L88 14" fill="#fff9ef" stroke="#1b2430" stroke-width="2.5"/>
            <path d="M2 48 A43 13 0 0 0 88 48" fill="none" stroke="#1b2430" stroke-width="1.5" opacity="0.4"/>
            <path d="M2 65 A43 13 0 0 0 88 65" fill="none" stroke="#1b2430" stroke-width="1.5" opacity="0.4"/>
            <circle cx="45" cy="30" r="5" fill="#7a8b69"/>
          </symbol>
          <!-- time: clock -->
          <symbol id="zhy-ico-clock" viewBox="0 0 70 70">
            <circle cx="35" cy="35" r="33" fill="#fff9ef" stroke="#1b2430" stroke-width="2.5"/>
            <circle cx="35" cy="35" r="18" stroke="#b5482d" stroke-width="2.2" fill="none"/>
            <line x1="35" y1="35" x2="35" y2="22" stroke="#b5482d" stroke-width="2.2" stroke-linecap="round"/>
            <line x1="35" y1="35" x2="45" y2="40" stroke="#b5482d" stroke-width="2.2" stroke-linecap="round"/>
          </symbol>
          <!-- location: map pin -->
          <symbol id="zhy-ico-pin" viewBox="0 0 46 60">
            <path d="M23 2 C34 2 42 11 42 21 C42 36 23 58 23 58 C23 58 4 36 4 21 C4 11 12 2 23 2 Z" fill="#fff9ef" stroke="#6c5ce7" stroke-width="2.5"/>
            <circle cx="23" cy="21" r="8" fill="#6c5ce7" opacity="0.85"/>
          </symbol>
          <!-- AI calling: voice waveform in a chat bubble -->
          <symbol id="zhy-ico-ai-wave" viewBox="0 0 150 100">
            <path d="M6 4 H144 A6 6 0 0 1 150 10 V64 A6 6 0 0 1 144 70 H40 L18 92 L22 70 H6 A6 6 0 0 1 0 64 V10 A6 6 0 0 1 6 4 Z" fill="#fff9ef" stroke="#1b2430" stroke-width="2.5"/>
            <rect x="22" y="38" width="8" height="20" rx="3" fill="#4ea1ff"/>
            <rect x="38" y="22" width="8" height="36" rx="3" fill="#6c5ce7"/>
            <rect x="54" y="32" width="8" height="26" rx="3" fill="#4ea1ff"/>
            <rect x="70" y="14" width="8" height="44" rx="3" fill="#6c5ce7"/>
            <rect x="86" y="30" width="8" height="28" rx="3" fill="#4ea1ff"/>
            <rect x="102" y="42" width="8" height="16" rx="3" fill="#6c5ce7"/>
          </symbol>
        </defs>

        <!-- connecting threads: simple center-to-center loop, so every line
             visibly starts and ends on a node regardless of each icon's shape -->
        <path class="zhy-thread" d="M92 68 Q 190 30 281 53"/>
        <path class="zhy-thread" d="M281 53 Q 314 40 347 52"/>
        <path class="zhy-thread" d="M347 52 Q 360 150 284 240"/>
        <path class="zhy-thread" d="M284 240 Q 180 260 74 231"/>
        <path class="zhy-thread" d="M74 231 Q 60 150 92 68"/>

        <!-- nodes: website top-left, clock + pin top-right, database bottom-left, AI-calling bottom-right -->
        <use href="#zhy-ico-website" x="14" y="18" width="156" height="100"/>
        <use href="#zhy-ico-clock" x="246" y="18" width="70" height="70"/>
        <use href="#zhy-ico-pin" x="324" y="22" width="46" height="60"/>
        <use href="#zhy-ico-database" x="26" y="180" width="96" height="102"/>
        <use href="#zhy-ico-ai-wave" x="198" y="183" width="172" height="115"/>
      </svg>
    </div>
  </section>
</div>
