<!--
ZOLEY — CASE STUDIES PAGE — FINAL CTA SECTION
-->

<div id="zly-cs-cta">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&family=DM+Sans:wght@400;500;700&family=Caveat:wght@600;700&display=swap');

    #zly-cs-cta {
      --paper: #faf3e7; --ink: #1b2430; --barn: #b5482d; --violet: #6c5ce7;
      font-family: 'DM Sans', sans-serif; background: var(--paper); color: var(--ink);
    }
    #zly-cs-cta * { box-sizing: border-box; margin: 0; padding: 0; }
    #zly-cs-cta .sec { padding: 0 24px 96px; max-width: 1160px; margin: 0 auto; }
    #zly-cs-cta h2 { font-family: 'Newsreader', serif; font-weight: 600; line-height: 1.1; letter-spacing: -0.01em; }
    #zly-cs-cta .cta-row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
    #zly-cs-cta .btn { display: inline-flex; align-items: center; gap: 8px; padding: 15px 28px; border-radius: 8px; font-weight: 700; font-size: 15.5px; text-decoration: none; transition: transform 0.15s ease, box-shadow 0.15s ease; }
    #zly-cs-cta .btn-primary { background: var(--barn); color: #fff9ef; box-shadow: 0 4px 0 #7c2f19; }
    #zly-cs-cta .btn-primary:hover { transform: translateY(2px); box-shadow: 0 2px 0 #7c2f19; }
    #zly-cs-cta .btn-ghost { background: transparent; border: 2px solid var(--ink); }

    #zly-cs-cta .final { background: var(--ink); border-radius: 14px; padding: 60px 40px; text-align: center; position: relative; overflow: hidden; }
    #zly-cs-cta .final::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 25% 20%, rgba(108,92,231,0.25), transparent 55%), radial-gradient(circle at 80% 85%, rgba(181,72,45,0.22), transparent 55%); }
    #zly-cs-cta .final > * { position: relative; }
    #zly-cs-cta .final h2 { color: var(--paper); font-size: clamp(27px, 3.2vw, 36px); margin-bottom: 14px; }
    #zly-cs-cta .final p { color: #c7d0d6; max-width: 460px; margin: 0 auto 28px; line-height: 1.65; }

    @media (max-width: 900px) {
      #zly-cs-cta .sec { padding: 0 20px 64px; }
      #zly-cs-cta .final { padding: 48px 28px; }
    }
    @media (max-width: 480px) {
      #zly-cs-cta .final { padding: 40px 22px; border-radius: 12px; }
      #zly-cs-cta .cta-row { flex-direction: column; align-items: stretch; }
      #zly-cs-cta .btn { justify-content: center; }
    }
  </style>

  <section class="sec">
    <div class="final">
      <h2>Want results like this?</h2>
      <p>No pressure, no pitch. Just a real conversation about what would actually help.</p>
      <div class="cta-row">
        <a href="https://calendly.com/zoley/free-30-min-discovery-call" class="btn btn-primary">Book a free chat</a>
        <a href="https://www.zoley.io/find-your-next-best-business-move" class="btn btn-ghost" style="color:#faf3e7; border-color:#faf3e7;">Tell us about your business</a>
      </div>
    </div>
  </section>
</div>
