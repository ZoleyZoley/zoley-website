<!--
ZOLEY — CASE STUDIES HUB PAGE — FINAL CTA SECTION
-->

<div id="zly-cs-hub-final-cta">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&family=DM+Sans:wght@400;500;700&family=Caveat:wght@600;700&display=swap');

    #zly-cs-hub-final-cta {
      --paper: #faf3e7; --paper-2: #f6e4b8; --card: #fff9ef;
      --ink: #1b2430; --ink-soft: #5c6b76;
      --marigold: #e3a72e; --barn: #b5482d; --sage: #7a8b69; --violet: #6c5ce7; --blue: #4ea1ff;
      --border: rgba(27,36,48,0.14);
      font-family: 'DM Sans', sans-serif; background: var(--paper); color: var(--ink);
    }
    #zly-cs-hub-final-cta * { box-sizing: border-box; margin: 0; padding: 0; }
    #zly-cs-hub-final-cta .sec { padding: 90px 24px; max-width: 1160px; margin: 0 auto; }
    #zly-cs-hub-final-cta h1, #zly-cs-hub-final-cta h2, #zly-cs-hub-final-cta h3 { font-family: 'Newsreader', serif; font-weight: 600; line-height: 1.1; letter-spacing: -0.01em; color: var(--ink); }
    #zly-cs-hub-final-cta p { color: var(--ink-soft); line-height: 1.65; }
    #zly-cs-hub-final-cta .tag { font-family: 'Caveat', cursive; font-size: 21px; font-weight: 700; display: inline-block; transform: rotate(-2deg); margin-bottom: 12px; padding: 0 4px; color: var(--barn); }

    /* BUTTONS */
    #zly-cs-hub-final-cta .btn { display: inline-flex; align-items: center; gap: 8px; padding: 15px 28px; border-radius: 8px; font-weight: 700; font-size: 15.5px; text-decoration: none; transition: transform 0.15s ease, box-shadow 0.15s ease; }
    #zly-cs-hub-final-cta .btn-primary { background: var(--barn); color: #fff9ef; box-shadow: 0 4px 0 #7c2f19; }
    #zly-cs-hub-final-cta .btn-primary:hover { transform: translateY(2px); box-shadow: 0 2px 0 #7c2f19; }
    #zly-cs-hub-final-cta .btn-outline { background: transparent; color: #fff9ef; border: 2px solid var(--barn); }
    #zly-cs-hub-final-cta .btn-outline:hover { background: var(--barn); }

    /* HEADER */
    #zly-cs-hub-final-cta .hero { padding: 108px 24px 64px; max-width: 780px; margin: 0 auto; text-align: center; }
    #zly-cs-hub-final-cta .hero h1 { font-size: clamp(34px, 4.6vw, 54px); }
    #zly-cs-hub-final-cta .hero p.sub { font-size: 18.5px; max-width: 540px; margin: 20px auto 0; }

    /* CASE STUDY GRID */
    #zly-cs-hub-final-cta .cs-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; }
    #zly-cs-hub-final-cta .cs-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 26px; box-shadow: 0 14px 30px -20px rgba(27,36,48,0.2); display: flex; flex-direction: column; scroll-margin-top: 40px; }
    #zly-cs-hub-final-cta .cs-media { width: 100%; aspect-ratio: 4 / 3; border-radius: 10px; overflow: hidden; margin-bottom: 20px; background: linear-gradient(135deg, rgba(122,139,105,0.18), rgba(78,161,255,0.18)); display: flex; align-items: center; justify-content: center; text-align: center; padding: 16px; }
    #zly-cs-hub-final-cta .cs-media span { font-size: 12.5px; color: var(--ink-soft); font-style: italic; }
    #zly-cs-hub-final-cta .cs-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
    #zly-cs-hub-final-cta .cs-cat { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--barn); border: 1px solid var(--border); background: var(--paper); padding: 4px 10px; border-radius: 999px; margin-bottom: 16px; align-self: flex-start; }
    #zly-cs-hub-final-cta .cs-stat-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; }
    #zly-cs-hub-final-cta .cs-num { font-family: 'Newsreader', serif; font-weight: 600; font-size: clamp(28px, 3vw, 34px); color: var(--barn); line-height: 1; }
    #zly-cs-hub-final-cta .cs-num-label { font-size: 13px; color: var(--ink-soft); }
    #zly-cs-hub-final-cta .cs-card h3 { font-size: 18px; margin-bottom: 8px; }
    #zly-cs-hub-final-cta .cs-card p { font-size: 14px; margin-bottom: 18px; flex-grow: 1; }
    #zly-cs-hub-final-cta .cs-link { font-weight: 700; color: var(--barn); text-decoration: none; border-bottom: 2px solid var(--barn); padding-bottom: 2px; align-self: flex-start; }

    /* FINAL CTA */
    #zly-cs-hub-final-cta .final { background: var(--ink); border-radius: 14px; padding: 60px 40px; text-align: center; margin: 0 24px; max-width: 1112px; margin-left: auto; margin-right: auto; position: relative; overflow: hidden; }
    #zly-cs-hub-final-cta .final::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 25% 20%, rgba(108,92,231,0.25), transparent 55%), radial-gradient(circle at 80% 85%, rgba(181,72,45,0.22), transparent 55%); }
    #zly-cs-hub-final-cta .final > * { position: relative; }
    #zly-cs-hub-final-cta .final h2 { color: var(--paper); font-size: clamp(27px, 3.2vw, 36px); margin-bottom: 14px; }
    #zly-cs-hub-final-cta .final p { color: #c7d0d6; max-width: 460px; margin: 0 auto 26px; }
    #zly-cs-hub-final-cta .final .btn-row { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }

    @media (max-width: 900px) {
      #zly-cs-hub-final-cta .cs-grid { grid-template-columns: repeat(2, 1fr); }
      #zly-cs-hub-final-cta .sec { padding: 60px 20px; }
    }
    @media (max-width: 620px) {
      #zly-cs-hub-final-cta .cs-grid { grid-template-columns: 1fr; }
    }
  </style>

  <!-- FINAL CTA -->
  <section class="sec" style="padding-bottom: 96px;">
    <div class="final">
      <h2>Want results like these?</h2>
      <p>A free call is the fastest way to find out what's possible for your business.</p>
      <div class="btn-row">
        <a href="https://calendly.com/zoley/free-30-min-discovery-call" class="btn btn-primary">Book a free call</a>
        <a href="#" class="btn btn-outline">Start an intake form</a>
      </div>
    </div>
  </section>
</div>
