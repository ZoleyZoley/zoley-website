<!--
ZOLEY — WEB DEVELOPMENT & DESIGN PAGE — CLOSING QUOTE SECTION
-->

<div id="zly-webdev-closing">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&family=DM+Sans:wght@400;500;700&family=Caveat:wght@600;700&display=swap');

    #zly-webdev-closing {
      --paper: #faf3e7; --paper-2: #f6e4b8; --ink: #1b2430; --ink-soft: #5c6b76;
      --barn: #b5482d;
      font-family: 'DM Sans', sans-serif; background: var(--paper); color: var(--ink);
    }
    #zly-webdev-closing * { box-sizing: border-box; margin: 0; padding: 0; }
    #zly-webdev-closing .sec { padding: 90px 24px 96px; max-width: 1160px; margin: 0 auto; }
    #zly-webdev-closing h2 { font-family: 'Newsreader', serif; font-weight: 600; line-height: 1.1; letter-spacing: -0.01em; color: var(--ink); }
    #zly-webdev-closing .btn { display: inline-flex; align-items: center; gap: 8px; padding: 15px 28px; border-radius: 8px; font-weight: 700; font-size: 15.5px; text-decoration: none; transition: transform 0.15s ease, box-shadow 0.15s ease; }
    #zly-webdev-closing .btn-primary { background: var(--barn); color: #fff9ef; box-shadow: 0 4px 0 #7c2f19; }
    #zly-webdev-closing .btn-primary:hover { transform: translateY(2px); box-shadow: 0 2px 0 #7c2f19; }

    #zly-webdev-closing .closing { background: var(--paper-2); border-radius: 14px; padding: 56px 44px; text-align: center; }
    #zly-webdev-closing .closing h2 { font-size: clamp(24px, 2.8vw, 32px); margin-bottom: 22px; }
    #zly-webdev-closing .closing blockquote { font-family: 'Newsreader', serif; font-style: italic; font-size: 20px; max-width: 540px; margin: 0 auto 10px; color: var(--ink); }
    #zly-webdev-closing .closing cite { font-size: 14px; color: var(--ink-soft); font-style: normal; }
    #zly-webdev-closing .closing .btn { margin-top: 24px; }

    @media (max-width: 900px) {
      #zly-webdev-closing .sec { padding: 60px 20px 64px; }
      #zly-webdev-closing .closing { padding: 40px 26px; }
    }
    @media (max-width: 480px) {
      #zly-webdev-closing .btn { width: 100%; justify-content: center; }
    }
  </style>

  <section class="sec">
    <div class="closing">
      <h2>Your website should open doors, not close them.</h2>
      <blockquote>"Design is not just what it looks like and feels like. Design is how it works."</blockquote>
      <cite>&mdash; Steve Jobs</cite>
      <div><a href="https://www.zoley.io/find-your-next-best-business-move" class="btn btn-primary">Let's build it together</a></div>
    </div>
  </section>
</div>
